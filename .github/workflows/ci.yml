name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 click rich

      - name: Check package imports
        run: |
          python -c "from insider_signal.models import Trade, Tier, Action; print('models OK')"
          python -c "from insider_signal.scoring import score_trade; print('scoring OK')"
